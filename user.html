<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - 个人健康管理平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16A34A',
                        secondary: '#F59E0B',
                        neutral: '#F3F4F6',
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-neutral min-h-screen flex flex-col">
    <!-- 侧边栏 + 顶部导航 -->
    <div class="flex flex-col md:flex-row">
        <!-- 侧边栏 -->
        <aside class="bg-white shadow-md w-full md:w-64 h-auto md:h-screen py-6">
            <div class="flex items-center justify-center md:justify-start px-6 mb-8">
                <i class="fa fa-heartbeat text-primary text-2xl mr-2"></i>
                <h1 class="text-xl font-bold text-gray-800">健康管理平台</h1>
            </div>
            <nav>
                <ul>
                    <li class="mb-2">
                        <a href="admin.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100">
                            <i class="fa fa-dashboard mr-3"></i>
                            <span>健康仪表盘</span>
                        </a>
                    </li>
                    <li class="mb-2">
                        <a href="health.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100">
                            <i class="fa fa-pencil-square-o mr-3"></i>
                            <span>健康数据记录</span>
                        </a>
                    </li>
                    <li class="mb-2">
                        <a href="mubiao.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100">
                            <i class="fa fa-bullseye mr-3"></i>
                            <span>健康目标设置</span>
                        </a>
                    </li>
                    <li class="mb-2">
                        <a href="user.html" class="flex items-center px-6 py-3 bg-primary/10 text-primary">
                            <i class="fa fa-user mr-3"></i>
                            <span>个人资料</span>
                        </a>
                    </li>
                    <li>
                        <a id="logoutBtn" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 cursor-pointer">
                            <i class="fa fa-sign-out mr-3"></i>
                            <span>退出登录</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <div class="flex-grow p-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 个人信息卡片 -->
                <div class="md:col-span-1 bg-white rounded-lg shadow-md p-6">
                    <div class="flex flex-col items-center">
                        <div class="w-24 h-24 rounded-full bg-primary/10 flex items-center justify-center mb-4">
                            <i class="fa fa-user text-primary text-4xl"></i>
                        </div>
                        <h2 class="text-xl font-bold text-gray-800 mb-1" id="profileUsername">用户名</h2>
                        <p class="text-gray-500 mb-6" id="profileMemberSince">注册时间：2025年1月1日</p>
                        
                        <div class="w-full border-t border-gray-200 pt-4">
                            <div class="flex justify-between mb-2">
                                <span class="text-gray-600">记录天数</span>
                                <span class="font-semibold" id="recordDays">0</span>
                            </div>
                            <div class="flex justify-between mb-2">
                                <span class="text-gray-600">平均每日步数</span>
                                <span class="font-semibold" id="avgSteps">0</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">目标完成率</span>
                                <span class="font-semibold text-primary" id="goalCompletion">0%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 资料编辑 -->
                <div class="md:col-span-2 bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">编辑个人资料</h2>
                    
                    <form id="profileForm">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label class="block text-gray-700 mb-2" for="fullName">真实姓名</label>
                                <input type="text" id="fullName" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入真实姓名">
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2" for="age">年龄</label>
                                <input type="number" id="age" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入年龄">
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2" for="gender">性别</label>
                                <select id="gender" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                                    <option value="">请选择</option>
                                    <option value="male">男</option>
                                    <option value="female">女</option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2" for="height">身高 (cm)</label>
                                <input type="number" id="height" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入身高">
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2" for="weight">体重 (kg)</label>
                                <input type="number" id="weight" min="0" step="0.1" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入体重">
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2" for="phone">联系电话</label>
                                <input type="tel" id="phone" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入联系电话">
                            </div>
                        </div>

                        <div class="mb-6">
                            <label class="block text-gray-700 mb-2" for="medicalHistory">健康状况/病史</label>
                            <textarea id="medicalHistory" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="如有特殊健康状况或病史，请在此说明"></textarea>
                        </div>

                        <div class="flex justify-end">
                            <button type="submit" class="bg-primary text-white px-6 py-2 rounded-md hover:bg-primary/90 transition">
                                <i class="fa fa-save mr-2"></i>保存资料
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 账户安全 -->
            <div class="bg-white rounded-lg shadow-md p-6 mt-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">账户安全</h2>
                
                <form id="passwordForm" class="max-w-2xl">
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2" for="oldPassword">当前密码</label>
                        <input type="password" id="oldPassword" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入当前密码">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2" for="newPassword">新密码</label>
                        <input type="password" id="newPassword" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请设置新密码（至少6位）">
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 mb-2" for="confirmNewPassword">确认新密码</label>
                        <input type="password" id="confirmNewPassword" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请再次输入新密码">
                    </div>
                    
                    <div class="flex justify-end">
                        <button type="submit" class="bg-primary text-white px-6 py-2 rounded-md hover:bg-primary/90 transition">
                            <i class="fa fa-lock mr-2"></i>修改密码
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="profile.js"></script>
</body>
</html>
