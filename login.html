<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人健康管理平台 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16A34A', // 健康绿
                        secondary: '#F59E0B', // 活力橙
                        neutral: '#F3F4F6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-neutral min-h-screen flex flex-col">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-md py-4 px-6">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa fa-heartbeat text-primary text-2xl"></i>
                <h1 class="text-xl font-bold text-gray-800">健康管理平台</h1>
            </div>
            <div>
                <button id="loginBtn" class="bg-primary text-white px-4 py-2 rounded-md hover:bg-primary/90 transition">登录</button>
                <button id="registerBtn" class="ml-2 bg-white border border-primary text-primary px-4 py-2 rounded-md hover:bg-primary/5 transition">注册</button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
            <!-- 登录表单 -->
            <div id="loginForm" class="block">
                <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">用户登录</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="loginUsername">用户名</label>
                    <input type="text" id="loginUsername" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入用户名">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 mb-2" for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入密码">
                </div>
                <button id="submitLogin" class="w-full bg-primary text-white py-2 rounded-md hover:bg-primary/90 transition mb-4">登录</button>
                <p class="text-center text-gray-600">还没有账号？<span id="toRegister" class="text-primary cursor-pointer">立即注册</span></p>
            </div>

            <!-- 注册表单 -->
            <div id="registerForm" class="hidden">
                <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">用户注册</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="regUsername">用户名</label>
                    <input type="text" id="regUsername" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请设置用户名">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="regEmail">邮箱</label>
                    <input type="email" id="regEmail" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入邮箱地址">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="regPassword">密码</label>
                    <input type="password" id="regPassword" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请设置密码（至少6位）">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 mb-2" for="regConfirmPassword">确认密码</label>
                    <input type="password" id="regConfirmPassword" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请再次输入密码">
                </div>
                <button id="submitRegister" class="w-full bg-primary text-white py-2 rounded-md hover:bg-primary/90 transition mb-4">注册</button>
                <p class="text-center text-gray-600">已有账号？<span id="toLogin" class="text-primary cursor-pointer">立即登录</span></p>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-6 px-6">
        <div class="container mx-auto text-center">
            <p>© 2025 个人健康管理平台 - 期末答辩项目</p>
        </div>
    </footer>

    <script src="auth.js"></script>
</body>
</html>
