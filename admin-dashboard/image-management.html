<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片管理 - 后台管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.544.0/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --primary-color: #3B82F6;
            --secondary-color: #1E40AF;
            --background-color: #F3F4F6;
            --card-background: #FFFFFF;
            --text-color: #1F2937;
            --muted-text-color: #6B7280;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
        }
        .sidebar {
            background-color: var(--card-background);
            transition: width 0.3s ease;
        }
        .sidebar.collapsed {
            width: 4.5rem;
        }
        .sidebar.collapsed .sidebar-text {
            display: none;
        }
        .sidebar.collapsed .sidebar-logo .logo-text {
            display: none;
        }
        .sidebar.collapsed .sidebar-footer .sidebar-text {
            display: none;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.25rem;
            color: var(--muted-text-color);
            transition: background-color 0.2s, color 0.2s;
            border-left: 3px solid transparent;
        }
        .sidebar-item:hover {
            background-color: #EFF6FF;
            color: var(--primary-color);
        }
        .sidebar-item.active {
            background-color: #EFF6FF;
            color: var(--primary-color);
            border-left-color: var(--primary-color);
        }
        .sidebar-icon {
            width: 1.25rem;
            height: 1.25rem;
            margin-right: 0.75rem;
        }
        .top-bar {
            background-color: var(--card-background);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }
        .search-bar {
            background-color: #F3F4F6;
            border-radius: 0.375rem;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            width: 24rem;
        }
        .search-bar input {
            background: none;
            border: none;
            outline: none;
            flex-grow: 1;
            margin-left: 0.5rem;
        }
        .card {
            background-color: var(--card-background);
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            padding: 1.25rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.2s;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--secondary-color);
        }
        .btn-outline {
            border: 1px solid #E5E7EB;
            color: var(--text-color);
        }
        .btn-outline:hover {
            background-color: #F9FAFB;
        }
        .btn-danger {
            background-color: #EF4444;
            color: white;
        }
        .btn-danger:hover {
            background-color: #DC2626;
        }
        .user-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background-color: #E5E7EB;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--text-color);
        }
        .filter-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .filter-group label {
            font-size: 0.875rem;
            color: var(--muted-text-color);
        }
        .filter-group select, .filter-group input {
            padding: 0.5rem;
            border: 1px solid #E5E7EB;
            border-radius: 0.375rem;
            background-color: white;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 2rem;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 0.5rem;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #E5E7EB;
            border-radius: 0.375rem;
            background-color: white;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        .image-card {
            position: relative;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }
        .image-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .image-card-info {
            padding: 0.75rem;
            background-color: white;
        }
        .image-card-info p {
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .image-card-info span {
            font-size: 0.75rem;
            color: var(--muted-text-color);
        }
        .image-card-actions {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.25rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .image-card:hover .image-card-actions {
            opacity: 1;
        }
        .image-card-actions button {
            background-color: white;
            border: none;
            border-radius: 50%;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }
        .dropzone {
            border: 2px dashed #E5E7EB;
            border-radius: 0.5rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .dropzone:hover {
            border-color: var(--primary-color);
        }
        .dropzone p {
            color: var(--muted-text-color);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="flex h-screen">

    <!-- Sidebar -->
    <aside class="sidebar w-64 flex flex-col">
        <div class="sidebar-logo p-4 flex items-center">
            <i data-lucide="layout-dashboard" class="w-8 h-8 text-blue-600"></i>
            <span class="logo-text text-xl font-bold ml-2">后台管理</span>
        </div>
        <nav class="flex-grow">
            <a href="index.html" class="sidebar-item">
                <i data-lucide="home" class="sidebar-icon"></i>
                <span class="sidebar-text">首页</span>
            </a>
            <a href="order-management.html" class="sidebar-item">
                <i data-lucide="shopping-cart" class="sidebar-icon"></i>
                <span class="sidebar-text">订单管理</span>
            </a>
            <a href="user-management.html" class="sidebar-item">
                <i data-lucide="users" class="sidebar-icon"></i>
                <span class="sidebar-text">用户管理</span>
            </a>
            <a href="image-management.html" class="sidebar-item active">
                <i data-lucide="image" class="sidebar-icon"></i>
                <span class="sidebar-text">图片管理</span>
            </a>
            <a href="system-settings.html" class="sidebar-item">
                <i data-lucide="settings" class="sidebar-icon"></i>
                <span class="sidebar-text">系统管理</span>
            </a>
        </nav>
        <div class="sidebar-footer p-4">
            <button id="sidebar-toggle" class="sidebar-item w-full justify-start">
                <i data-lucide="chevrons-left" class="sidebar-icon"></i>
                <span class="sidebar-text">收起</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">

        <!-- Top Bar -->
        <header class="top-bar h-16 flex items-center justify-between px-6">
            <div class="search-bar">
                <i data-lucide="search" class="w-5 h-5 text-gray-400"></i>
                <input type="text" placeholder="搜索图片...">
            </div>
            <div class="flex items-center space-x-4">
                <button class="btn btn-outline" onclick="window.location.href='../admin.html'">
                    <i data-lucide="home" class="w-5 h-5 mr-2"></i>
                    返回健康平台
                </button>
                <button class="btn btn-outline">
                    <i data-lucide="bell" class="w-5 h-5 mr-2"></i>
                    通知
                </button>
                <div class="flex items-center">
                    <div class="user-avatar">JD</div>
                    <div class="ml-3">
                        <p class="text-sm font-semibold">John Doe</p>
                        <p class="text-xs text-gray-500">Admin</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-grow p-6 overflow-y-auto">
            <h1 class="text-2xl font-bold mb-6">图片管理</h1>

            <!-- Upload Zone -->
            <div class="card mb-6">
                <div class="dropzone" id="dropzone">
                    <i data-lucide="upload-cloud" class="w-12 h-12 text-gray-400 mx-auto mb-4"></i>
                    <p>点击或拖拽文件到此处上传</p>
                    <p class="text-xs text-gray-500">支持 JPG, PNG, GIF 格式，单个文件不超过 5MB</p>
                    <input type="file" id="file-input" class="hidden" multiple accept="image/*">
                    <button class="btn btn-primary mt-4" id="upload-btn">选择文件</button>
                </div>
            </div>

            <!-- Filters -->
            <div class="card mb-6">
                <div class="filter-container">
                    <div class="filter-group">
                        <label for="image-category">图片分类:</label>
                        <select id="image-category">
                            <option value="all">全部</option>
                            <option value="banner">横幅</option>
                            <option value="product">产品</option>
                            <option value="avatar">头像</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="image-date">上传日期:</label>
                        <input type="date" id="image-date-from">
                        <span>至</span>
                        <input type="date" id="image-date-to">
                    </div>
                    <button class="btn btn-primary ml-auto" id="apply-filters">
                        <i data-lucide="filter" class="w-5 h-5 mr-2"></i>
                        应用筛选
                    </button>
                </div>
            </div>

            <!-- Image Grid -->
            <div class="image-grid">
                <div class="image-card">
                    <img src="https://p3-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/a6f1cbad362a42ff9727dcffdcf5897a.png~tplv-a9rns2rl98-24:720:720.png?rcl=2025121617114284C17D16A8AA09E9F701&rk3s=8e244e95&rrcfp=8a172a1a&x-expires=1766481103&x-signature=DKVwZpVHMusqXUMZW8oN%2B1UhynY%3D" alt="图片1">
                    <div class="image-card-actions">
                        <button class="edit-image-btn" title="编辑"><i data-lucide="edit" class="w-4 h-4"></i></button>
                        <button class="delete-image-btn" title="删除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <div class="image-card-info">
                        <p>dashboard-1.jpg</p>
                        <span>2023-10-15</span>
                    </div>
                </div>
                <div class="image-card">
                    <img src="https://p3-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/cddce9ffcbde49f79f36df20b775510c.png~tplv-a9rns2rl98-24:720:720.png?rcl=2025121617114284C17D16A8AA09E9F701&rk3s=8e244e95&rrcfp=8a172a1a&x-expires=1766481103&x-signature=W%2Ba2hXhEn6fkxNTUtC41T1rX8kA%3D" alt="图片2">
                    <div class="image-card-actions">
                        <button class="edit-image-btn" title="编辑"><i data-lucide="edit" class="w-4 h-4"></i></button>
                        <button class="delete-image-btn" title="删除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <div class="image-card-info">
                        <p>dashboard-2.jpg</p>
                        <span>2023-10-14</span>
                    </div>
                </div>
                <div class="image-card">
                    <img src="https://p3-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/2a674c27d947457886934b4df379cd5e.png~tplv-a9rns2rl98-24:720:720.png?rcl=2025121617114284C17D16A8AA09E9F701&rk3s=8e244e95&rrcfp=8a172a1a&x-expires=1766481103&x-signature=Y96Q2wS4sbZUZLYVm18rmab5p3M%3D" alt="图片3">
                    <div class="image-card-actions">
                        <button class="edit-image-btn" title="编辑"><i data-lucide="edit" class="w-4 h-4"></i></button>
                        <button class="delete-image-btn" title="删除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <div class="image-card-info">
                        <p>dashboard-3.jpg</p>
                        <span>2023-10-13</span>
                    </div>
                </div>
                 <div class="image-card">
                    <img src="https://p3-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/42617b513c9d4580aa9410fa617156ae.png~tplv-a9rns2rl98-24:720:720.png?rcl=2025121617114284C17D16A8AA09E9F701&rk3s=8e244e95&rrcfp=8a172a1a&x-expires=1766481103&x-signature=LiAhCVuhXajzmTvyuGlqJKD24uk%3D" alt="图片4">
                    <div class="image-card-actions">
                        <button class="edit-image-btn" title="编辑"><i data-lucide="edit" class="w-4 h-4"></i></button>
                        <button class="delete-image-btn" title="删除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <div class="image-card-info">
                        <p>dashboard-4.jpg</p>
                        <span>2023-10-12</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Image Modal -->
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 class="text-xl font-bold mb-4">编辑图片信息</h2>
            <form id="image-form">
                <div class="form-group">
                    <label for="modal-image-name">图片名称</label>
                    <input type="text" id="modal-image-name" required>
                </div>
                <div class="form-group">
                    <label for="modal-image-category">图片分类</label>
                    <select id="modal-image-category" required>
                        <option value="banner">横幅</option>
                        <option value="product">产品</option>
                        <option value="avatar">头像</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modal-image-alt">Alt 文本</label>
                    <input type="text" id="modal-image-alt">
                </div>
                <div class="form-group">
                    <label for="modal-image-description">描述</label>
                    <textarea id="modal-image-description" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="cancel-modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 检查用户是否已登录
        if (!localStorage.getItem('currentUser')) {
            // 如果未登录，重定向到登录页面
            window.location.href = '../login.html';
        }
        
        lucide.createIcons();

        // Sidebar Toggle
        const sidebar = document.querySelector('.sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebarToggleIcon = sidebarToggle.querySelector('i');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            if (sidebar.classList.contains('collapsed')) {
                sidebarToggleIcon.setAttribute('data-lucide', 'chevrons-right');
                sidebarToggle.querySelector('.sidebar-text').textContent = '展开';
            } else {
                sidebarToggleIcon.setAttribute('data-lucide', 'chevrons-left');
                sidebarToggle.querySelector('.sidebar-text').textContent = '收起';
            }
            lucide.createIcons();
        });
        
        // Search Functionality
        const searchInput = document.querySelector('.search-bar input');
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                alert(`搜索图片: ${searchInput.value}`);
                searchInput.value = '';
            }
        });

        // Modal Functionality
        const imageModal = document.getElementById('image-modal');
        const closeBtns = document.querySelectorAll('.close');
        const cancelModalBtn = document.getElementById('cancel-modal');
        const imageForm = document.getElementById('image-form');

        closeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                imageModal.style.display = "none";
            });
        });

        cancelModalBtn.addEventListener('click', () => {
            imageModal.style.display = "none";
        });

        window.addEventListener('click', (event) => {
            if (event.target == imageModal) {
                imageModal.style.display = "none";
            }
        });

        imageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('图片信息已更新！');
            imageModal.style.display = "none";
        });

        // Upload Functionality
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');

        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('border-blue-500');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('border-blue-500');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('border-blue-500');
            const files = e.dataTransfer.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                alert(`已选择 ${files.length} 个文件，准备上传...`);
                // 这里可以添加实际的上传逻辑
            }
        }

        // Image Card Operations
        const editImageButtons = document.querySelectorAll('.edit-image-btn');
        const deleteImageButtons = document.querySelectorAll('.delete-image-btn');
        const imageCards = document.querySelectorAll('.image-card');

        editImageButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                e.stopPropagation();
                const card = e.target.closest('.image-card');
                const imageName = card.querySelector('.image-card-info p').textContent;
                
                document.getElementById('modal-image-name').value = imageName;
                imageModal.style.display = "block";
            });
        });

        deleteImageButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                e.stopPropagation();
                const card = e.target.closest('.image-card');
                const imageName = card.querySelector('.image-card-info p').textContent;
                if (confirm(`确定要删除图片 ${imageName} 吗？`)) {
                    card.remove();
                }
            });
        });

        imageCards.forEach(card => {
            card.addEventListener('click', () => {
                const imgSrc = card.querySelector('img').src;
                // 这里可以实现图片预览功能
                alert(`预览图片: ${imgSrc}`);
            });
        });

        // Filter Functionality
        const applyFiltersBtn = document.getElementById('apply-filters');
        applyFiltersBtn.addEventListener('click', () => {
            const categoryFilter = document.getElementById('image-category').value;
            const dateFrom = document.getElementById('image-date-from').value;
            const dateTo = document.getElementById('image-date-to').value;
            alert(`筛选条件已应用: 分类=${categoryFilter}, 日期=${dateFrom}至${dateTo}`);
        });

    </script>
</body>
</html>
