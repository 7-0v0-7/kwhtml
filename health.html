<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康数据记录 - 个人健康管理平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16A34A',
                        secondary: '#F59E0B',
                        neutral: '#F3F4F6',
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-neutral min-h-screen flex flex-col">
    <!-- 侧边栏 + 顶部导航 -->
    <div class="flex flex-col md:flex-row">
        <!-- 侧边栏 -->
        <aside class="bg-white shadow-md w-full md:w-64 h-auto md:h-screen py-6">
            <div class="flex items-center justify-center md:justify-start px-6 mb-8">
                <i class="fa fa-heartbeat text-primary text-2xl mr-2"></i>
                <h1 class="text-xl font-bold text-gray-800">健康管理平台</h1>
            </div>
            <nav>
                <ul>
                    <li class="mb-2">
                        <a href="admin.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100">
                            <i class="fa fa-dashboard mr-3"></i>
                            <span>健康仪表盘</span>
                        </a>
                    </li>
                    <li class="mb-2">
                        <a href="health.html" class="flex items-center px-6 py-3 bg-primary/10 text-primary">
                            <i class="fa fa-pencil-square-o mr-3"></i>
                            <span>健康数据记录</span>
                        </a>
                    </li>
                    <li class="mb-2">
                        <a href="mubiao.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100">
                            <i class="fa fa-bullseye mr-3"></i>
                            <span>健康目标设置</span>
                        </a>
                    </li>
                    <li class="mb-2">
                        <a href="user.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100">
                            <i class="fa fa-user mr-3"></i>
                            <span>个人资料</span>
                        </a>
                    </li>
                    <li>
                        <a id="logoutBtn" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 cursor-pointer">
                            <i class="fa fa-sign-out mr-3"></i>
                            <span>退出登录</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <div class="flex-grow p-6">
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">记录今日健康数据</h2>
                
                <form id="healthRecordForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 步数 -->
                    <div>
                        <label class="block text-gray-700 mb-2" for="stepsInput">今日步数</label>
                        <div class="flex items-center">
                            <input type="number" id="stepsInput" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入今日步数">
                            <span class="ml-2 text-gray-500">步</span>
                        </div>
                    </div>

                    <!-- 饮水量 -->
                    <div>
                        <label class="block text-gray-700 mb-2" for="waterInput">今日饮水量</label>
                        <div class="flex items-center">
                            <input type="number" id="waterInput" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入今日饮水量">
                            <span class="ml-2 text-gray-500">ml</span>
                        </div>
                    </div>

                    <!-- 睡眠时间 -->
                    <div>
                        <label class="block text-gray-700 mb-2" for="sleepInput">昨日睡眠时间</label>
                        <div class="flex items-center">
                            <input type="number" id="sleepInput" min="0" step="0.5" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入昨日睡眠时间">
                            <span class="ml-2 text-gray-500">小时</span>
                        </div>
                    </div>

                    <!-- 卡路里消耗 -->
                    <div>
                        <label class="block text-gray-700 mb-2" for="calorieInput">今日卡路里消耗</label>
                        <div class="flex items-center">
                            <input type="number" id="calorieInput" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="请输入今日卡路里消耗">
                            <span class="ml-2 text-gray-500">千卡</span>
                        </div>
                    </div>

                    <!-- 备注 -->
                    <div class="md:col-span-2">
                        <label class="block text-gray-700 mb-2" for="notesInput">今日健康备注</label>
                        <textarea id="notesInput" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="记录今日的健康状态、运动情况等"></textarea>
                    </div>

                    <!-- 提交按钮 -->
                    <div class="md:col-span-2 flex justify-end">
                        <button type="submit" class="bg-primary text-white px-6 py-2 rounded-md hover:bg-primary/90 transition">
                            <i class="fa fa-save mr-2"></i>保存记录
                        </button>
                    </div>
                </form>
            </div>

            <!-- 历史记录 -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-xl font-bold text-gray-800 mb-4 flex justify-between items-center">
                    <span>历史记录</span>
                    <button id="clearHistoryBtn" class="text-red-500 text-sm hover:text-red-700">
                        <i class="fa fa-trash mr-1"></i>清空历史
                    </button>
                </h3>
                <div id="historyRecords" class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">日期</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">步数</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">饮水量(ml)</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">睡眠(小时)</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">卡路里(千卡)</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- 历史记录会通过JS动态生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="record.js"></script>
</body>
</html>
